# nginx del frontend en Docker (local y AWS EC2).
#  - Sirve el build de React.
#  - Reenvía /api y Swagger al Gateway: el navegador ve UNA sola dirección
#    (http://localhost o http://IP-de-la-EC2), sin CORS y con la cookie del refresh funcionando.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: "gateway" se resuelve al pedirlo (y no al arrancar nginx),
  # así nginx no se cae si el Gateway todavía está iniciando.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway http://gateway:8080;

  # API REST y Swagger -> Gateway
  location ~ ^/(api|swagger-ui|webjars|v3/api-docs|openapi)(/|\.html$|$) {
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Página y API comparten dirección, así que no es una petición entre orígenes.
    # Se quita Origin para que el backend no tenga que conocer la IP pública de la EC2
    # (cambia en cada sesión del Learner Lab). La protección CSRF se mantiene: el login
    # exige el encabezado X-Requested-With y la cookie es SameSite=Strict.
    proxy_set_header Origin "";
    proxy_read_timeout 60s;
  }

  # Archivos con hash en el nombre (assets de Vite): caché larga.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # React Router: cualquier otra ruta (/productos/2, /admin/usuarios...) devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
