<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Volcán Market — Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body>
  <nav id="store-navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <!-- Generado dinámicamente por assets/js/store-nav.js -->
  </nav>

  <main class="container py-5">
    <h1 class="h3 mb-4">Nuestros productos</h1>

    <section>
      <div class="row g-4">
        <!-- TODO: reemplazar por listado dinámico (JS) cuando exista esa lógica -->
        <div class="col-sm-6 col-lg-4">
          <div class="card h-100">
            <img src="../assets/img/cilindro-5kg.jpg" class="card-img-top" alt="Cilindro de gas 5 kg">
            <div class="card-body d-flex flex-column">
              <h2 class="h5 card-title">Cilindro 5 kg</h2>
              <p class="card-text text-muted mb-3">$8.500</p>
              <div class="mt-auto d-flex gap-2">
                <a href="product-detail.html" class="btn btn-outline-primary btn-sm">Ver detalle</a>
                <button type="button" class="btn btn-primary btn-sm">Añadir</button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-sm-6 col-lg-4">
          <div class="card h-100">
            <img src="../assets/img/cilindro-11kg.jpg" class="card-img-top" alt="Cilindro de gas 11 kg">
            <div class="card-body d-flex flex-column">
              <h2 class="h5 card-title">Cilindro 11 kg</h2>
              <p class="card-text text-muted mb-3">$16.500</p>
              <div class="mt-auto d-flex gap-2">
                <a href="product-detail.html" class="btn btn-outline-primary btn-sm">Ver detalle</a>
                <button type="button" class="btn btn-primary btn-sm">Añadir</button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-sm-6 col-lg-4">
          <div class="card h-100">
            <img src="../assets/img/cilindro-15kg.jpg" class="card-img-top" alt="Cilindro de gas 15 kg">
            <div class="card-body d-flex flex-column">
              <h2 class="h5 card-title">Cilindro 15 kg</h2>
              <p class="card-text text-muted mb-3">$21.000</p>
              <div class="mt-auto d-flex gap-2">
                <a href="product-detail.html" class="btn btn-outline-primary btn-sm">Ver detalle</a>
                <button type="button" class="btn btn-primary btn-sm">Añadir</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white-50 text-center py-4 mt-4">
    <p class="mb-1">&copy; 2026 Distribuidora de Gas El Volcán — Chillán, Región de Ñuble.</p>
    <p class="mb-0">Atención al cliente y respuesta a domicilio.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/store-nav.js"></script>
</body>
</html>
