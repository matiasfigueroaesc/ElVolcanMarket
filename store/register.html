<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Volcán Market — Registro de usuario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body>
  <nav id="store-navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <!-- Generado dinámicamente por assets/js/store-nav.js -->
  </nav>

  <main class="container py-5">
    <h1 class="h3 mb-4">Crear una cuenta</h1>

    <section style="max-width: 640px;">
      <form id="register-form">
        <div class="mb-3">
          <label for="reg-run" class="form-label">Run (sin puntos ni guión, ej: 19011022K)</label>
          <input type="text" class="form-control" id="reg-run" name="regRun" required minlength="7" maxlength="9">
          <div class="invalid-feedback" id="error-reg-run"></div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <label for="reg-name" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="reg-name" name="regName" required maxlength="50">
            <div class="invalid-feedback" id="error-reg-name"></div>
          </div>
          <div class="col-sm-6">
            <label for="reg-lastname" class="form-label">Apellidos</label>
            <input type="text" class="form-control" id="reg-lastname" name="regLastname" required maxlength="100">
            <div class="invalid-feedback" id="error-reg-lastname"></div>
          </div>
        </div>

        <div class="mb-3">
          <label for="reg-email" class="form-label">Correo</label>
          <input type="email" class="form-control" id="reg-email" name="regEmail" required maxlength="100">
          <div class="form-text">Solo correos @duoc.cl, @profesor.duoc.cl o @gmail.com</div>
          <div class="invalid-feedback" id="error-reg-email"></div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <label for="reg-password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="reg-password" name="regPassword" required minlength="4" maxlength="10">
            <div class="invalid-feedback" id="error-reg-password"></div>
          </div>
          <div class="col-sm-6">
            <label for="reg-password-confirm" class="form-label">Confirmar contraseña</label>
            <input type="password" class="form-control" id="reg-password-confirm" name="regPasswordConfirm" required minlength="4" maxlength="10">
            <div class="invalid-feedback" id="error-reg-password-confirm"></div>
          </div>
        </div>

        <div class="mb-3">
          <label for="reg-phone" class="form-label">Teléfono (opcional)</label>
          <input type="tel" class="form-control" id="reg-phone" name="regPhone" placeholder="Ej: 912345678">
        </div>

        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <label for="reg-region" class="form-label">Región</label>
            <!-- TODO: reemplazar por el arreglo oficial de regiones/comunas -->
            <select class="form-select" id="reg-region" name="regRegion" required>
              <option value="" selected disabled>-- Seleccione región --</option>
              <option value="metropolitana">Región Metropolitana de Santiago</option>
              <option value="araucania">Región de la Araucanía</option>
              <option value="nuble">Región de Ñuble</option>
            </select>
          </div>
          <div class="col-sm-6">
            <label for="reg-comuna" class="form-label">Comuna</label>
            <!-- TODO: comunas deberían filtrarse en JS según la región seleccionada -->
            <select class="form-select" id="reg-comuna" name="regComuna" required>
              <option value="" selected disabled>-- Seleccione comuna --</option>
              <option value="chillan">Chillán</option>
              <option value="chillan-viejo">Chillán Viejo</option>
            </select>
          </div>
        </div>

        <div class="mb-4">
          <label for="reg-address" class="form-label">Dirección</label>
          <input type="text" class="form-control" id="reg-address" name="regAddress" required maxlength="300">
          <div class="invalid-feedback" id="error-reg-address"></div>
        </div>

        <button type="submit" class="btn btn-primary">Registrarse</button>
        <a href="login.html" class="btn btn-link">¿Ya tienes cuenta? Inicia sesión</a>
      </form>
    </section>
  </main>

  <footer class="bg-dark text-white-50 text-center py-4 mt-4">
    <p class="mb-1">&copy; 2026 Distribuidora de Gas El Volcán — Chillán, Región de Ñuble.</p>
    <p class="mb-0">Atención al cliente y respuesta a domicilio.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/store-nav.js"></script>
  <script src="../assets/js/validations.js"></script>
</body>
</html>
