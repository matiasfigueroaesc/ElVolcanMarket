<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Volcán Market — Contacto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body>
  <nav id="store-navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <!-- Generado dinámicamente por assets/js/store-nav.js -->
  </nav>

  <main class="container py-5">
    <h1 class="h3 mb-4">Contacto</h1>

    <section style="max-width: 560px;">
      <p class="text-muted">
        ¿Tienes dudas o necesitas coordinar un pedido especial? Escríbenos y te responderemos
        a la brevedad.
      </p>

      <form id="contact-form">
        <div class="mb-3">
          <label for="contact-name" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="contact-name" name="contactName" required maxlength="100">
          <div class="invalid-feedback" id="error-contact-name"></div>
        </div>

        <div class="mb-3">
          <label for="contact-email" class="form-label">Correo (opcional)</label>
          <input type="email" class="form-control" id="contact-email" name="contactEmail" maxlength="100">
          <div class="form-text">Si lo indicas, solo @duoc.cl, @profesor.duoc.cl o @gmail.com</div>
          <div class="invalid-feedback" id="error-contact-email"></div>
        </div>

        <div class="mb-4">
          <label for="contact-comment" class="form-label">Comentario</label>
          <textarea class="form-control" id="contact-comment" name="contactComment" rows="4" required maxlength="500"></textarea>
          <div class="invalid-feedback" id="error-contact-comment"></div>
        </div>

        <button type="submit" class="btn btn-primary">Enviar mensaje</button>
      </form>
    </section>
  </main>

  <footer class="bg-dark text-white-50 text-center py-4 mt-4">
    <p class="mb-1">&copy; 2026 Distribuidora de Gas El Volcán — Chillán, Región de Ñuble.</p>
    <p class="mb-0">Atención al cliente y respuesta a domicilio.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/store-nav.js"></script>
  <script src="../assets/js/validations.js"></script>
</body>
</html>
