<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Volcán Market — Seguimiento de pedido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body>
  <nav id="store-navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom"></nav>
  <main class="container py-5">
    <h1 class="mb-4">Seguimiento de pedido</h1>
    <div id="tracking-error" class="alert alert-danger d-none" role="alert"></div>
    <form id="tracking-form" class="row g-2 mb-4">
      <div class="col-sm-8 col-md-6">
        <input id="tracking-order-id" class="form-control" type="text" placeholder="ID de Pedido" required>
      </div>
      <div class="col-sm-4 col-md-3">
        <button class="btn btn-primary w-100" type="submit">Buscar</button>
      </div>
    </form>
    <div id="tracking-results" class="d-none">
      <div id="tracking-timeline" class="d-flex flex-wrap gap-2 mb-4">
        <span class="badge text-bg-secondary p-3">Recibido</span>
        <span class="badge text-bg-secondary p-3">Preparando</span>
        <span class="badge text-bg-secondary p-3">En Camino</span>
        <span class="badge text-bg-secondary p-3">Entregado</span>
      </div>
      <div id="map" style="height:350px;"></div>
    </div>
  </main>
  <footer class="bg-dark text-white-50 text-center py-4 mt-4">
    <p class="mb-1">&copy; 2026 Distribuidora de Gas El Volcán — Chillán, Región de Ñuble.</p>
    <p class="mb-0">Atención al cliente y respuesta a domicilio.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../assets/js/users.js"></script>
  <script src="../assets/js/store-nav.js"></script>
  <script src="../assets/js/tracking.js"></script>
</body>
</html>
