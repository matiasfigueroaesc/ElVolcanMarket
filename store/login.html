<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Volcán Market — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body>
  <nav id="store-navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <!-- Generado dinámicamente por assets/js/store-nav.js -->
  </nav>

  <main class="container py-5 d-flex flex-column align-items-center">
    <h1 class="h3 mb-4">Iniciar sesión</h1>

    <section class="card p-4" style="max-width: 420px; width: 100%;">
      <form id="login-form">
        <div class="mb-3">
          <label for="login-email" class="form-label">Correo</label>
          <input type="email" class="form-control" id="login-email" name="loginEmail" required maxlength="100">
          <div class="form-text">@duoc.cl, @profesor.duoc.cl o @gmail.com</div>
          <div class="invalid-feedback" id="error-login-email"></div>
        </div>

        <div class="mb-4">
          <label for="login-password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="login-password" name="loginPassword" required minlength="4" maxlength="10">
          <div class="invalid-feedback" id="error-login-password"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
        <a href="register.html" class="btn btn-link w-100 mt-2">¿No tienes cuenta? Regístrate</a>
      </form>
    </section>
  </main>

  <footer class="bg-dark text-white-50 text-center py-4 mt-4">
    <p class="mb-1">&copy; 2026 Distribuidora de Gas El Volcán — Chillán, Región de Ñuble.</p>
    <p class="mb-0">Atención al cliente y respuesta a domicilio.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/store-nav.js"></script>
  <script src="../assets/js/validations.js"></script>
  <script src="../assets/js/cart.js"></script>
</body>
</html>
