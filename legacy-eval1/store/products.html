<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Volcán Market — Productos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body>
  <nav id="store-navbar" class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <!-- Generado dinámicamente por assets/js/store-nav.js -->
  </nav>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">Nuestros productos</h1>
      <span id="cantidadProductos" class="text-muted"></span>
    </div>

    <div class="row g-3 align-items-end mb-4">
      <div class="col-sm-8 col-md-5 col-lg-4 col-xl-3">
        <label for="product-category-filter" class="form-label">Filtrar por categoría</label>
        <select class="form-select" id="product-category-filter">
          <option value="">Todas las categorías</option>
          <option value="Cilindros de Gas">Cilindros de Gas</option>
          <option value="Reguladores">Reguladores</option>
          <option value="Mangueras y Conexiones">Mangueras y Conexiones</option>
          <option value="Accesorios">Accesorios</option>
        </select>
      </div>
    </div>

    <section>
      <div id="contenedorProductos" class="row g-4">
        <!-- Se llena dinámicamente desde assets/js/products.js -->
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white-50 text-center py-4 mt-4">
    <p class="mb-1">&copy; 2026 Distribuidora de Gas El Volcán — Chillán, Región de Ñuble.</p>
    <p class="mb-0">Atención al cliente y respuesta a domicilio.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/users.js"></script>
  <script src="../assets/js/store-nav.js"></script>
  <script src="../assets/js/products.js"></script>
  <script src="../assets/js/cart.js"></script>
</body>
</html>
