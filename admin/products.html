<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Volcán Market — Productos (admin)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex">
    <nav id="admin-sidebar" class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark" style="width: 260px; min-height: 100vh;">
      <!-- Generado dinámicamente por assets/js/admin-nav.js -->
    </nav>

    <main class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Productos</h1>
        <a href="new-product.html" class="btn btn-primary">+ Nuevo producto</a>
      </div>

      <section>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Stock crítico</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <!-- TODO: filas generadas dinámicamente (requiere backend/BD). Ejemplo de estructura: -->
              <tr>
                <td>CIL-05</td>
                <td>Cilindro de Gas Licuado 5 kg</td>
                <td>5 kg</td>
                <td>$8.500</td>
                <td>24</td>
                <td>5</td>
                <td class="text-end">
                  <a href="edit-product.html" class="btn btn-sm btn-outline-secondary">Editar</a>
                  <button type="button" class="btn btn-sm btn-outline-danger">Eliminar</button>
                </td>
              </tr>
              <tr>
                <td>CIL-11</td>
                <td>Cilindro de Gas Licuado 11 kg</td>
                <td>11 kg</td>
                <td>$16.500</td>
                <td>3</td>
                <td>5</td>
                <td class="text-end">
                  <span class="badge text-bg-warning me-1">Stock crítico</span>
                  <a href="edit-product.html" class="btn btn-sm btn-outline-secondary">Editar</a>
                  <button type="button" class="btn btn-sm btn-outline-danger">Eliminar</button>
                </td>
              </tr>
              <tr>
                <td>CIL-15</td>
                <td>Cilindro de Gas Licuado 15 kg</td>
                <td>15 kg</td>
                <td>$21.000</td>
                <td>18</td>
                <td>5</td>
                <td class="text-end">
                  <a href="edit-product.html" class="btn btn-sm btn-outline-secondary">Editar</a>
                  <button type="button" class="btn btn-sm btn-outline-danger">Eliminar</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-nav.js"></script>
</body>
</html>
