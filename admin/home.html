<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Volcán Market — Panel administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex">
    <nav id="admin-sidebar" class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark" style="width: 260px; min-height: 100vh;">
      <!-- Generado dinámicamente por assets/js/admin-nav.js -->
    </nav>

    <main class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">¡Hola, Administrador!</h1>
        <span class="badge text-bg-secondary">Administrador</span>
      </div>

      <section class="mb-4">
        <div class="row g-3">
          <div class="col-sm-6 col-lg-4">
            <div class="card text-center">
              <div class="card-body">
                <p class="text-muted mb-1">Productos registrados</p>
                <!-- TODO: total real de cilindros (requiere backend/BD) -->
                <p class="h4 mb-0">—</p>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-4">
            <div class="card text-center">
              <div class="card-body">
                <p class="text-muted mb-1">Usuarios registrados</p>
                <!-- TODO: total real de usuarios (requiere backend/BD) -->
                <p class="h4 mb-0">—</p>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-4">
            <div class="card text-center">
              <div class="card-body">
                <p class="text-muted mb-1">Productos en stock crítico</p>
                <!-- TODO: total real bajo el mínimo (requiere backend/BD) -->
                <p class="h4 mb-0">—</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section>
        <h2 class="h5 mb-3">Accesos rápidos</h2>
        <div class="d-flex gap-2 flex-wrap">
          <a href="new-product.html" class="btn btn-primary">+ Nuevo producto</a>
          <a href="new-user.html" class="btn btn-outline-primary">+ Nuevo usuario</a>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-nav.js"></script>
</body>
</html>
