<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Volcán Market — Nuevo usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex">
    <nav id="admin-sidebar" class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark" style="width: 260px; min-height: 100vh;">
      <!-- Generado dinámicamente por assets/js/admin-nav.js -->
    </nav>

    <main class="flex-grow-1 p-4">
      <h1 class="h3 mb-4">Nuevo usuario</h1>

      <section style="max-width: 640px;">
        <form id="new-user-form">
          <div class="mb-3">
            <label for="user-run" class="form-label">Run (sin puntos ni guión, ej: 19011022K)</label>
            <input type="text" class="form-control" id="user-run" name="userRun" required minlength="7" maxlength="9">
            <div class="invalid-feedback" id="error-user-run"></div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label for="user-name" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="user-name" name="userName" required maxlength="50">
              <div class="invalid-feedback" id="error-user-name"></div>
            </div>
            <div class="col-sm-6">
              <label for="user-lastname" class="form-label">Apellidos</label>
              <input type="text" class="form-control" id="user-lastname" name="userLastname" required maxlength="100">
              <div class="invalid-feedback" id="error-user-lastname"></div>
            </div>
          </div>

          <div class="mb-3">
            <label for="user-email" class="form-label">Correo</label>
            <input type="email" class="form-control" id="user-email" name="userEmail" required maxlength="100">
            <div class="form-text">Solo correos @duoc.cl, @profesor.duoc.cl o @gmail.com</div>
            <div class="invalid-feedback" id="error-user-email"></div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label for="user-birthdate" class="form-label">Fecha de nacimiento (opcional)</label>
              <input type="date" class="form-control" id="user-birthdate" name="userBirthdate">
            </div>
            <div class="col-sm-6">
              <label for="user-type" class="form-label">Tipo de usuario</label>
              <select class="form-select" id="user-type" name="userType" required>
                <option value="" selected disabled>-- Seleccione --</option>
                <option value="administrador">Administrador</option>
                <option value="vendedor">Vendedor</option>
                <option value="cliente">Cliente</option>
              </select>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label for="user-region" class="form-label">Región</label>
              <!-- TODO: reemplazar por el arreglo oficial de regiones/comunas complementario al Anexo 1 -->
              <select class="form-select" id="user-region" name="userRegion" required>
                <option value="" selected disabled>-- Seleccione región --</option>
                <option value="metropolitana">Región Metropolitana de Santiago</option>
                <option value="araucania">Región de la Araucanía</option>
                <option value="nuble">Región de Ñuble</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label for="user-comuna" class="form-label">Comuna</label>
              <!-- TODO: comunas deberían filtrarse en JS según la región seleccionada -->
              <select class="form-select" id="user-comuna" name="userComuna" required>
                <option value="" selected disabled>-- Seleccione comuna --</option>
                <option value="chillan">Chillán</option>
                <option value="chillan-viejo">Chillán Viejo</option>
              </select>
            </div>
          </div>

          <div class="mb-4">
            <label for="user-address" class="form-label">Dirección</label>
            <input type="text" class="form-control" id="user-address" name="userAddress" required maxlength="300">
            <div class="invalid-feedback" id="error-user-address"></div>
          </div>

          <div class="d-flex gap-2">
            <a href="users.html" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar usuario</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-nav.js"></script>
  <script src="../assets/js/validations.js"></script>
</body>
</html>
